services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carmarket
      POSTGRES_USER: carmarket
      POSTGRES_PASSWORD: carmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmarket -d carmarket"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://carmarket:carmarket@db:5432/carmarket
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
